<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Политическая география — зачёт</title><style>body{font:16px/1.6 system-ui;margin:0;background:#f5f6fa;color:#181a23}header{position:sticky;top:0;background:#17192b;color:white;padding:14px;z-index:2}nav{max-width:1200px;margin:auto;display:flex;gap:8px;overflow:auto}nav a{color:white;text-decoration:none;padding:7px 10px;white-space:nowrap}.wrap{max-width:1200px;margin:auto;padding:22px}.hero,.card{background:white;border:1px solid #e1e4ed;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 6px 25px #20234b12}.hero{background:linear-gradient(135deg,#17192b,#5b5ce2);color:white}.hero h1{font-size:clamp(34px,6vw,60px);line-height:1;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-block;background:#eeeefe;color:#5052ad;padding:4px 8px;border-radius:8px;font-size:12px}details{border-top:1px solid #e3e6ef;padding:10px 0}summary{cursor:pointer;font-weight:700}.deep{background:#17192b;color:white;border-radius:14px;padding:18px}.term{border:1px solid #ddd;border-radius:20px;background:#fafaff;padding:7px 10px;margin:4px;cursor:pointer}.terms{display:flex;flex-wrap:wrap}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.box{background:white;max-width:600px;padding:25px;border-radius:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><header><nav><b>POLITGEOGRAPHY / ЗАЧЁТ</b><a href="#01">01 ПГ</a><a href="#02">02 Страны</a><a href="#03">03 Выборы</a><a href="#04">04 Границы</a><a href="#05">05 Регионы</a><a href="#06">06 Экономика</a><a href="#terms">Термины</a><a href="#quiz">Квиз</a></nav></header><main class="wrap"><section class="hero"><h1>Политическая география</h1><p>Интерактивная подготовка к зачёту: тезисы → аргументы → вопросы → объяснение «если совсем туплю».</p><p><b>6 тем · 2 статьи · словарь · квиз</b></p></section><input class="search" id="search" placeholder="Искать термин или вопрос…"><div id="topics"></div><section id="terms" class="card"><h2>Кликабельный словарь</h2><div class="terms" id="termList"></div></section><section id="quiz" class="card"><h2>Мини-квиз</h2><div id="quizbox"></div><button onclick="quiz()">Новый набор</button></section></main><div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="box"><button onclick="modal.classList.remove('on')">Закрыть</button><h2 id="mt"></h2><p id="md"></p></div></div><script>const T=[['01','Введение в политическую географию + геополитика','Пространство → власть','Политическая география изучает взаимосвязи политической деятельности и территории. Важны территориальность, границы, центры управления и разные масштабы. Геополитика уже: пространственная организация международной силы.','Heartland Маккиндера — внутренняя Евразия; Mahan — морская сила; Rimland Спайкмена — прибрежный пояс; Сол Коэн — более сложная многополюсная модель. Геостратегия — прикладные предложения для конкретного государства.','Если туплю: вопрос ПГ — «что происходит, ГДЕ и почему в другом месте иначе?». Геополитика — тот же вопрос на масштабе государств и мира. Модели Heartland/Rimland — аналитические модели, а не законы природы.'],['02','Политическое страноведение + геоконфликтология','Страна → государство → конфликт','Страна и государство не одно и то же. Государство — политическое образование с суверенитетом; страна — более широкое территориальное понятие. Политическая карта показывает политико-территориальную организацию мира.','Четыре общности Трейвиша: государственная, национальная, экономическая, территориальная. Регионы можно выделять по географии, культуре, истории, религии, политике. Геоконфликтология изучает пространственное измерение конфликтов.','Если туплю: страна — «территория как объект описания», государство — «суверенная политическая организация». Конфликт тоже имеет географию: территория может быть предметом спора, ресурсом и средством контроля.'],['03','Электоральная география','Выборы → место','Изучает результаты выборов и электоральное поведение в пространстве. Важны избирательные системы, партии, территориальные расколы, композиционный и контекстуальный подходы.','Композиционный: кто живёт на территории. Контекстуальный: как сама среда влияет на людей. Ecological fallacy — нельзя автоматически переносить среднюю характеристику района на каждого жителя. Важны neighbourhood effect, friends & neighbors, hysteresis.','Если туплю: два вопроса — «какие люди живут здесь?» и «что делает само место с их поведением?». Поэтому одинаковые люди в разных средах могут голосовать по-разному.'],['04','Границы + интеграция','Граница → барьер / фильтр / контакт','Лимология изучает границы. Граница бывает барьерной, фильтрующей или контактной; антецедентной, субсеквентной, наложенной, реликтовой/фантомной.','Интеграция углубляет взаимодействие: преференциальная торговля → ЗСТ → таможенный союз → общий рынок → экономический союз → политический союз. Важны суверенитет и многоуровневое управление.','Если туплю: граница не всегда «стена». Она может запрещать, пропускать выборочно или облегчать контакты. Интеграция — это постепенное снижение барьеров и/или создание общих институтов.'],['05','Политическая регионалистика','Центр → регион','Политический регион выделяется по политически значимому критерию. Регион может быть однородным, функциональным или синтетическим. Важны АТД, федерация, унитарность, автономия, центр–периферия.','Однородный район — сходство признаков; функциональный — связи вокруг узла; синтетический — совокупность признаков. Унитарное государство не обязательно централизованное: возможна децентрализация.','Если туплю: регион — не обязательно «кусок карты». Это аналитическая конструкция: мы выбираем критерий и смотрим, какие территории образуют связную систему.'],['06','Экономическая география','Хозяйство → пространство','Изучает пространственную организацию хозяйства, размещение экономической деятельности и различия территорий. Главный вопрос: почему деятельность возникает именно здесь?','Факторы размещения: ресурсы, люди, транспорт, рынок, капитал, технологии, институты. Агломерационный эффект объясняет преимущества концентрации фирм и людей. МГРТ — специализация стран/регионов и обмен результатами. ТНК и глобальные цепочки создают трансграничное распределение стадий производства. Новая экономическая география Кругмана связывает концентрацию с возрастающей отдачей, транспортными издержками и размером рынка.','Если туплю: бери завод. Почему здесь? Сырьё? Люди? Рынок? Транспорт? Капитал? Технологии? Институты? Соседние фирмы? Ответ почти всегда комбинация факторов, а не один «магический» ресурс.']];const Q=[['Что изучает политическая география?','Взаимосвязи политической деятельности и территории.'],['Чем страна отличается от государства?','Государство обладает суверенитетом; страна — более широкое территориальное понятие.'],['Что такое Heartland?','Внутренняя ключевая зона Евразии в модели Маккиндера.'],['Что такое hysteresis?','Сохранение исторического политического эффекта после исчезновения исходных причин.'],['Композиционный подход?','Объясняет результат характеристиками населения территории.'],['Что такое ecological fallacy?','Ошибка переноса агрегированной характеристики территории на каждого индивида.'],['Что такое лимология?','Изучение границ и пространственных размежеваний.'],['Стадии интеграции по Балассе?','Преференциальная торговля → ЗСТ → таможенный союз → общий рынок → экономический союз → политический союз.'],['Что такое МГРТ?','Международное географическое разделение труда: территориальная специализация и обмен.'],['Что такое агломерационный эффект?','Преимущества концентрации фирм и людей на одной территории.'],['Что такое ТНК?','Компания, координирующая деятельность в нескольких странах.'],['Что объясняет новая экономическая география Кругмана?','Концентрацию активности через возрастающую отдачу, транспортные издержки и размер рынка.']];const defs={ПГ:'Политическая география — взаимосвязь политики и территории.',Геополитика:'Анализ пространственной организации международной политической силы.',Страна:'Территориальное понятие, не тождественное суверенному государству.',Суверенитет:'Верховенство публичной власти внутри территории и независимость от внешнего подчинения.',Электоральная_география:'Изучение выборов и электорального поведения в пространстве.',Ecological_fallacy:'Ошибка переноса агрегированной закономерности территории на индивида.',Hysteresis:'Сохранение эффекта исторических причин после исчезновения самих причин.',Лимология:'Изучение границ.',Центр_периферия:'Иерархическое различие между центрами и перифериями.',МГРТ:'Международное географическое разделение труда.',Агломерация:'Преимущества концентрации фирм и людей.',ТНК:'Транснациональная корпорация.',Глобализация:'Усиление трансграничной взаимосвязанности хозяйств.',Кругман:'Новая экономическая география; концентрация через возрастающую отдачу, транспортные издержки и размер рынка.'};topics.innerHTML=T.map(t=>`<section id="${t[0]}" class="card"><span class="tag">${t[0]}</span><h2>${t[1]}</h2><p><b>${t[2]}</b></p><div class="grid"><div><h3>Главное</h3><p>${t[3]}</p><h3>Аргументы и модели</h3><p>${t[4]}</p></div><div class="deep"><b>ЕСЛИ СОВСЕМ ТУПЛЮ</b><p>${t[5]}</p></div></div>${t[0]==='03'?'<h3>Статьи</h3><p><b>Van Hamme, Vandermotten & Medina Lockhart:</b> историческая инерция электоральных географий, transmission factors и hysteresis. <b>Туровский:</b> геокультурные расколы + центр–периферия и факторный анализ.</p>':''}</section>`).join('');termList.innerHTML=Object.keys(defs).map(k=>`<button class="term" onclick="mt.textContent='${k.replace(/_/g,' ')}';md.textContent='${defs[k]}';modal.classList.add('on')">${k.replace(/_/g,' ')}</button>`).join('');function quiz(){quizbox.innerHTML=[...Q].sort(()=>Math.random()-.5).slice(0,5).map((q,i)=>`<details><summary>${i+1}. ${q[0]}</summary><p>${q[1]}</p></details>`).join('')}quiz();search.oninput=()=>{let q=search.value.toLowerCase();document.querySelectorAll('#topics .card').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'':'none')}</script></html>
